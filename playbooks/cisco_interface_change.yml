---
# Use case 1: ServiceNow Change -> AWX -> Cisco IOS-XE pre-check / change / post-check -> back to the same Change.
# extra_vars from ServiceNow: snow_table, snow_sys_id, snow_number, target_device, interface,
#                             int_description, int_shutdown
# "interface" can be one interface or several in one change: Loopback200 | Loopback200-209 | Lo200,Lo201,Lo305

- name: Cisco interface change | pre-check, apply, post-check
  hosts: "{{ target_device | default('demo-iosxe', true) }}"
  gather_facts: false
  vars:
    intf_spec: "{{ interface | default('Loopback123', true) }}"
    intf_list: "{{ intf_spec | expand_interfaces(max_interfaces) }}"
    max_interfaces: 20
    protected_interfaces: [GigabitEthernet1]   # management uplink of the DevNet sandbox
    check_commands: >-
      {{ ['show ip interface brief']
         + (intf_list | map('regex_replace', '^', 'show running-config | section ^interface ')
                      | map('regex_replace', '$', '$') | list) }}
    change_lines: >-
      {{ ([('description ' ~ int_description)] if (int_description | default('') | length) else [])
         + (['shutdown'] if (int_shutdown | default(false) | bool) else ['no shutdown']) }}
  tasks:
    - name: Run change with pre/post checks
      block:
        - name: Guardrail | refuse changes on protected interfaces
          ansible.builtin.assert:
            that: (intf_list | map('lower') | list | intersect(protected_interfaces | map('lower') | list)) | length == 0
            fail_msg: >-
              {{ intf_list | map('lower') | list | intersect(protected_interfaces | map('lower') | list) | join(', ') }}
              is a protected management interface - change refused by policy
            quiet: true

        - name: PRE-CHECK | capture state
          cisco.ios.ios_command:
            commands: "{{ check_commands }}"
          register: pre

        - name: CHANGE | configure {{ intf_spec }}
          cisco.ios.ios_config:
            parents: "interface {{ item }}"
            lines: "{{ change_lines }}"
          loop: "{{ intf_list }}"
          register: change

        - name: Settle time before post-check
          ansible.builtin.pause:
            seconds: 5

        - name: POST-CHECK | capture state
          cisco.ios.ios_command:
            commands: "{{ check_commands }}"
          register: post

        - name: Mark device stage complete
          ansible.builtin.set_fact:
            cisco_ok: true
            intfs: "{{ intf_list }}"
            pushed_lines: "{{ change.results | map(attribute='commands') | select('defined') | flatten }}"
      rescue:
        - name: Record failure for the report
          ansible.builtin.set_fact:
            cisco_ok: false
            cisco_error: "{{ ansible_failed_result.msg | default(ansible_failed_result | string) }}"

- name: Cisco interface change | validate and report back to ServiceNow
  hosts: localhost
  gather_facts: false
  vars:
    dev: "{{ target_device | default('demo-iosxe', true) }}"
    intf_spec: "{{ interface | default('Loopback123', true) }}"
    h: "{{ hostvars[dev] if dev in hostvars else {} }}"
    intfs: "{{ h.intfs | default([intf_spec]) }}"
    pre_out: "{{ h.pre.stdout | default([]) if h.pre is defined else [] }}"
    post_out: "{{ h.post.stdout | default([]) if h.post is defined else [] }}"
    pre_brief: "{{ pre_out[0] | default('') }}"
    post_brief: "{{ post_out[0] | default('') }}"
    pre_cfg: "{{ pre_out[1:] | join('\n') }}"
    post_cfg: "{{ post_out[1:] | join('\n') }}"
    want_shut: "{{ int_shutdown | default(false) | bool }}"
    header: >-
      <h3 style="margin:0">{{ snow_number | default('') }} &mdash; Cisco interface change</h3>
      Device <b>{{ dev }}</b> &middot; Interface{{ 's' if intfs | length > 1 else '' }} <b>{{ intf_spec }}</b>
      {{ '(' ~ (intfs | length) ~ ' interfaces)' if intfs | length > 1 else '' }} &middot;
      AWX job #{{ tower_job_id | default(awx_job_id | default('n/a')) }}<br/><br/>
  tasks:
    - name: Report when the device stage did not run
      when: h.cisco_ok is not defined or not (h.cisco_ok | bool)
      block:
        - name: ServiceNow | failure note
          ansible.builtin.include_tasks: tasks/snow_update.yml
          vars:
            automation_status: failed
            note_html: >-
              {{ header }}<b style="color:#cf222e">FAILED before completion &mdash; no post-check comparison.</b><br/>
              Reason: {{ (h.cisco_error | default('device unreachable or not in AWX inventory')) | e }}

        - name: Fail the AWX job
          ansible.builtin.fail:
            msg: "{{ h.cisco_error | default('device stage did not complete') }}"

    - name: Evaluate post-check validations
      ansible.builtin.set_fact:
        checks: >-
          {{ (intfs | interface_checks(post_out[1:], post_brief, want_shut, int_description | default('')))
             + [{'name': 'No impact on other interfaces',
                 'ok': (pre_brief | other_intfs(intfs)) == (post_brief | other_intfs(intfs)),
                 'detail': 'all other interfaces unchanged'
                           if (pre_brief | other_intfs(intfs)) == (post_brief | other_intfs(intfs))
                           else 'state changed on other interfaces - review diff'}] }}

    - name: Build comparison report
      ansible.builtin.set_fact:
        overall_ok: "{{ checks | map(attribute='ok') | map('bool') | min }}"
        cfg_diff: "{{ pre_cfg | unified_diff(post_cfg, 'running-config (pre)', 'running-config (post)') }}"
        brief_diff: "{{ pre_brief | unified_diff(post_brief, 'ip int brief (pre)', 'ip int brief (post)') }}"

    - name: ServiceNow | write pre/post comparison to the ticket
      ansible.builtin.include_tasks: tasks/snow_update.yml
      vars:
        automation_status: "{{ 'success' if overall_ok | bool else 'failed' }}"
        note_html: >-
          {{ header }}
          <b style="font-size:14px;color:{{ '#116329' if overall_ok | bool else '#cf222e' }}">
          {{ 'CHANGE SUCCESSFUL &mdash; all post-checks passed' if overall_ok | bool else 'POST-CHECK FAILED &mdash; review required' }}</b><br/><br/>
          <b>Commands pushed:</b> <code>{{ (h.pushed_lines | default([])) | join(' ; ') | e }}</code><br/><br/>
          {{ checks | checks_html('Post-check validation') }}<br/>
          <b>Running-config diff</b>{{ cfg_diff | diff_html }}
          <b>Interface status diff</b>{{ brief_diff | diff_html }}
          <i>Full pre/post outputs attached to this ticket.</i>

    - name: ServiceNow | attach full pre/post outputs
      ansible.builtin.include_tasks: tasks/snow_attach.yml
      vars:
        file_name: "{{ snow_number | default('change') }}_{{ dev }}_pre_post.txt"
        file_content: |
          ===== PRE-CHECK =====
          {% for o in pre_out %}
          {{ o }}

          {% endfor %}
          ===== POST-CHECK =====
          {% for o in post_out %}
          {{ o }}

          {% endfor %}
          ===== DIFF =====
          {{ cfg_diff }}
          {{ brief_diff }}

    - name: Fail the AWX job if validation failed
      ansible.builtin.fail:
        msg: "Post-check validation failed"
      when: not (overall_ok | bool)
