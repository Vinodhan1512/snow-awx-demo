---
# One-time helper: connect the AWX server to the Cisco DevNet sandbox VPN so AWX jobs can reach 10.10.20.0/24.
# Runs as an AWX job (no SSH from outside needed): the job container SSHes to its own host via the
# container's default gateway, installs openconnect and starts a split-tunnel VPN as a systemd service.
# Values come from the "Sandbox VPN" credential (env vars) created by vpn_setup.py.

- name: Locate the AWX server from inside the job container
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read the container routing table
      ansible.builtin.slurp:
        src: /proc/net/route
      register: route_table
      when: not lookup('env', 'AWX_NODE_IP')

    - name: Pick the server address (container default gateway unless AWX_NODE_IP is set)
      ansible.builtin.set_fact:
        node_ip: "{{ lookup('env', 'AWX_NODE_IP') or (route_table.content | b64decode | default_gateway) }}"

    - name: Make sure an address was found
      ansible.builtin.assert:
        that: node_ip | length > 0
        fail_msg: "Could not find the AWX server address. Set AWX_NODE_IP in .env (the server's private IP) and run vpn_setup.py again."

    - name: Show where we will connect
      ansible.builtin.debug:
        msg: "Connecting to the AWX server at {{ node_ip }} as {{ lookup('env', 'NODE_SSH_USER') }}"

    - name: Add the AWX server as a host for this run
      ansible.builtin.add_host:
        name: awx-node
        ansible_host: "{{ node_ip }}"
        ansible_connection: ssh
        ansible_user: "{{ lookup('env', 'NODE_SSH_USER') }}"
        ansible_password: "{{ lookup('env', 'NODE_SSH_PASSWORD') or omit }}"
        ansible_become_password: "{{ lookup('env', 'NODE_SSH_PASSWORD') or omit }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'NODE_SSH_KEY_FILE') or omit }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      no_log: true

- name: Connect the AWX server to the sandbox VPN (split tunnel, lab network only)
  hosts: awx-node
  become: true
  gather_facts: false
  tasks:
    - name: Copy the host-side VPN script
      ansible.builtin.copy:
        src: ../scripts/sandbox_vpn_host.sh
        dest: /root/sandbox_vpn_host.sh
        mode: "0700"

    - name: Install openconnect and start the split-tunnel VPN service
      ansible.builtin.command: bash /root/sandbox_vpn_host.sh
      environment:
        VPN_HOST: "{{ lookup('env', 'SANDBOX_VPN_HOST') }}"
        VPN_USER: "{{ lookup('env', 'SANDBOX_VPN_USER') }}"
        VPN_PASS: "{{ lookup('env', 'SANDBOX_VPN_PASSWORD') }}"
        ROUTER: "{{ lookup('env', 'SANDBOX_ROUTER_IP') | default('10.10.20.48', true) }}"
      register: vpn_run
      changed_when: true

    - name: Script output
      ansible.builtin.debug:
        var: vpn_run.stdout_lines

- name: Confirm AWX jobs can reach the lab router
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check from inside the job container
      ansible.builtin.wait_for:
        host: "{{ lookup('env', 'SANDBOX_ROUTER_IP') | default('10.10.20.48', true) }}"
        port: 22
        timeout: 60

    - name: Done
      ansible.builtin.debug:
        msg: "VPN is up. AWX jobs can reach the Cisco sandbox router on SSH."
